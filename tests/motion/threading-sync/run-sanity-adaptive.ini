[EMC]
VERSION = 1.1
MACHINE = THREADING-SYNC-TEST
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 2.0

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALFILE = threading-sync.hal
HALFILE = LIB:sim_spindle_encoder.hal
POSTGUI_HALFILE = postgui.hal

[TRAJ]
NO_FORCE_HOMING = 1
COORDINATES = X Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 200.0
DEFAULT_LINEAR_ACCELERATION = 500.0
MAX_LINEAR_ACCELERATION = 500.0
SPINDLES = 1
# 0 = trapezoidal, 1 = S-curve (Ruckig).  Overridden per test case by test.sh.
PLANNER_TYPE = 0
MAX_JERK = 10000.0

[KINS]
KINEMATICS = trivkins coordinates=xz
JOINTS = 2

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 500.0
MAX_JERK = 10000.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 500.0
MAX_JERK = 10000.0
BACKLASH = 0.000
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
FERROR = 1.0
MIN_FERROR = 0.5
HOME_SEQUENCE = 0

[AXIS_Z]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 500.0
MAX_JERK = 10000.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 500.0
MAX_JERK = 10000.0
BACKLASH = 0.000
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
FERROR = 1.0
MIN_FERROR = 0.5
HOME_SEQUENCE = 0
